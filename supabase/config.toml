project_id = "2026-codex-hackathon-15"

[api]
enabled = true
port = 54321
schemas = ["api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
# 호스팅 프로젝트에서는 Google 공급자를 활성화합니다. 로컬 DB 테스트는
# OAuth 비밀값 없이 재현할 수 있도록 비활성화하고 auth.users fixture를 사용합니다.
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
skip_nonce_check = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created"

[edge_runtime]
enabled = false

[analytics]
enabled = false
